<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Battle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        #game-container { position: relative; width: 600px; height: 500px; }
        canvas { background-color: #020617; border: 2px solid #38bdf8; border-radius: 8px; }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.85); border-radius: 8px; }
        .ui-overlay h2 { font-size: 2rem; color: #f43f5e; margin-bottom: 10px; }
        .btn { background-color: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; text-decoration: none; margin-top: 10px; }
        .btn:hover { background-color: #0284c7; color: #fff; }
        .nav-btn { position: absolute; top: 15px; left: 15px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <a href="index.html" class="btn nav-btn">← Back Home</a>
    <h1>SPACE BATTLE</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="500"></canvas>
        <div id="start-screen" class="ui-overlay">
            <button class="btn" onclick="startGame()">START BATTLE</button>
        </div>
        <div id="game-over-screen" class="ui-overlay hidden">
            <h2>SHIP DESTROYED</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">RETRY</button>
        </div>
    </div>
    <p style="margin-top: 10px; color: #94a3b8;">Move: <strong>A / D</strong> or <strong>Arrows</strong> | Shoot: <strong>Spacebar</strong></p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let isPlaying = false, score = 0, animId, spawnTimer = 0;
        let bullets = [], enemies = [], keys = {};
        const player = { x: 280, y: 450, width: 40, height: 30, speed: 6 };

        window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space' && isPlaying) shoot(); });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function shoot() { bullets.push({ x: player.x + 18, y: player.y, w: 4, h: 10 }); }

        function startGame() {
            player.x = 280; bullets = []; enemies = []; score = 0; spawnTimer = 0;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            isPlaying = true;
            if (animId) cancelAnimationFrame(animId);
            loop();
        }

        function loop() {
            if (!isPlaying) return;
            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) player.x -= player.speed;
            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.width) player.x += player.speed;

            spawnTimer++;
            if (spawnTimer > 35) {
                enemies.push({ x: Math.random() * 560, y: -20, w: 30, h: 20, speed: 2.5 });
                spawnTimer = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Player
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Bullets
            ctx.fillStyle = '#facc15';
            for(let i=bullets.length-1; i>=0; i--) {
                bullets[i].y -= 7;
                ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].w, bullets[i].h);
                if (bullets[i].y < 0) bullets.splice(i, 1);
            }

            // Enemies
            for(let i=enemies.length-1; i>=0; i--) {
                let e = enemies[i]; e.y += e.speed;
                ctx.fillStyle = '#f43f5e'; ctx.fillRect(e.x, e.y, e.w, e.h);

                if (player.x < e.x + e.w && player.x + player.width > e.x && player.y < e.y + e.h && player.y + player.height > e.y || e.y > canvas.height) {
                    isPlaying = false;
                    document.getElementById('final-score').innerText = score;
                    document.getElementById('game-over-screen').classList.remove('hidden');
                    return;
                }

                for(let j=bullets.length-1; j>=0; j--) {
                    let b = bullets[j];
                    if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                        enemies.splice(i, 1); bullets.splice(j, 1); score += 100; break;
                    }
                }
            }

            ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.fillText(`SCORE: ${score}`, 20, 30);
            animId = requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
