<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Runner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        #game-container { position: relative; width: 800px; height: 300px; }
        canvas { background-color: #1e293b; border: 2px solid #38bdf8; border-radius: 8px; }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.85); border-radius: 8px; }
        .ui-overlay h2 { font-size: 2rem; color: #f43f5e; margin-bottom: 10px; }
        .btn { background-color: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; text-decoration: none; margin-top: 10px; }
        .btn:hover { background-color: #0284c7; color: #fff; }
        .nav-btn { position: absolute; top: 15px; left: 15px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <a href="index.html" class="btn nav-btn">← Back Home</a>
    <h1>CYBER RUNNER</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        <div id="start-screen" class="ui-overlay">
            <button class="btn" onclick="startGame()">START GAME</button>
        </div>
        <div id="game-over-screen" class="ui-overlay hidden">
            <h2>SYSTEM CRASHED</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">RETRY</button>
        </div>
    </div>
    <p style="margin-top: 10px; color: #94a3b8;">Press <strong>Spacebar</strong> to Jump</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let isPlaying = false, score = 0, gameSpeed = 6, animId, timer = 0, obstacles = [];
        const player = { x: 80, y: 220, width: 30, height: 40, dy: 0, gravity: 0.6, jump: -12, grounded: false };

        window.addEventListener('keydown', (e) => {
            if ((e.code === 'Space' || e.code === 'ArrowUp') && player.grounded && isPlaying) {
                player.dy = player.jump;
                player.grounded = false;
            }
        });

        function startGame() {
            player.y = 220; player.dy = 0; player.grounded = true; obstacles = []; score = 0; gameSpeed = 6; timer = 0;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            isPlaying = true;
            if (animId) cancelAnimationFrame(animId);
            loop();
        }

        function loop() {
            if (!isPlaying) return;
            score++;
            if (score % 500 === 0) gameSpeed += 0.5;

            player.dy += player.gravity; player.y += player.dy;
            if (player.y >= 220) { player.y = 220; player.dy = 0; player.grounded = true; }

            timer++;
            if (timer > Math.max(40, 100 - gameSpeed * 3)) {
                let h = Math.floor(Math.random() * 30) + 30;
                obstacles.push({ x: canvas.width, y: canvas.height - 40 - h, width: 20, height: h });
                timer = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#334155'; ctx.fillRect(0, 260, canvas.width, 2);
            ctx.fillStyle = '#38bdf8'; ctx.fillRect(player.x, player.y, player.width, player.height);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i]; o.x -= gameSpeed;
                ctx.fillStyle = '#f43f5e'; ctx.fillRect(o.x, o.y, o.width, o.height);

                if (player.x < o.x + o.width && player.x + player.width > o.x && player.y < o.y + o.height && player.y + player.height > o.y) {
                    isPlaying = false;
                    document.getElementById('final-score').innerText = score;
                    document.getElementById('game-over-screen').classList.remove('hidden');
                    return;
                }
                if (o.x < -20) obstacles.splice(i, 1);
            }

            ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.fillText(`SCORE: ${score}`, 20, 30);
            animId = requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
